- name: Setup Tecprofile EC2 Stack
  hosts: localhost
  connection: local
  gather_facts: False
  tasks:

    - name: Import VPC Setup Variables
      include_vars: vars/output_vars

    - name: Import Tecpro Setup Variables
      include_vars: vars/tecprovars

    - name: Create Tecpro EC2 Key Pair
      amazon.aws.ec2_key:
        name: tecpro_key
        region: "{{ region }}"
      register: key_out

    - name: Save private key into file logintecpro-key.pem
      copy:
        content: "{{ key_out.key.private_key }}"
        dest: "./logintecpro-key.pem"
        mode: 0600
      when: key_out.changed

    - name: Create Securiry Group for Tecpro Load Balancer
      amazon.aws.ec2_group:
        name: tecproELB-sg
        description: Allow port 80 from everywhere and all port within sg
        region: "{{region}}"
        vpc_id: "{{vpc_id}}"
        rules:
          - proto: tcp
            from_port: 80
            to_port: 80
            cidr_ip: 0.0.0.0/0
      register: tecproELBSG_out

    - name: Create Securiry Group for Tecpro Stack
      amazon.aws.ec2_group:
        name: tecproStack-sg
        description: Allow port 22 from everywhere and all port within sg
        region: "{{region}}"
        vpc_id: "{{vpc_id}}"
        purge_rules: no
        rules:
          - proto: tcp
            from_port: 80
            to_port: 80
            group_id: "{{tecproELBSG_out.group_id}}"

          - proto: tcp
            from_port: 22
            to_port: 22
            group_id: "{{bastion_sgid}}"
      register: tecproStackSG_out

    - name: Update Tecpro Stack Security Group
      amazon.aws.ec2_group:
        name: tecproStack-sg
        description: Allow port 22 from everywhere and all port within sg
        region: "{{region}}"
        vpc_id: "{{vpc_id}}"
        purge_rules: no
        rules:
          - proto: all
            group_id: "{{tecproStackSG_out.group_id}}"
      register: tecproStackSG_out

    - name: Launch Tecpro Stack EC2 Instance for nginx web server
      amazon.aws.ec2_instance:
        key_name: tecpro_key
        region: "{{ region }}"
        instance_type: t2.micro
        image_id: "{{nginx_ami}}"
        wait: yes
        wait_timeout: 300
        tags:
          Name: nginx_instance
          Project: Tecprofile
          Owner: DevOps Team
        exact_count: 1
        security_groups:
          - "{{ tecproStackSG_out.group_id }}"
        #group_id: "{{ tecproStackSG_out.group_id }}"
        vpc_subnet_id: "{{ private_subnet1id }}"
      register: nginx_instance_out

    - name: Launch Tecpro Stack EC2 Instances for Apache Tomcat
      amazon.aws.ec2_instance:
        key_name: tecpro_key
        region: "{{ region }}"
        instance_type: t2.micro
        image_id: "{{tomcat_ami}}"
        wait: yes
        wait_timeout: 300
        tags:
          Name: tomcat_instance
          Project: Tecprofile
          Owner: DevOps Team
        exact_count: 1
        security_groups:
          - "{{ tecproStackSG_out.group_id }}"
        #group_id: "{{ tecproStackSG_out.group_id }}"
        vpc_subnet_id: "{{ private_subnet1id }}"
      register: tomcat_instance_out

    - name: Launch Tecpro Stack EC2 Instance for Memcache
      amazon.aws.ec2_instance:
        key_name: tecpro_key
        region: "{{ region }}"
        instance_type: t2.micro
        image_id: "{{memcache_ami}}"
        wait: yes
        wait_timeout: 300
        tags:
          Name: memcache_instance
          Project: Tecprofile
          Owner: DevOps Team
        exact_count: 1
        security_groups:
          - "{{ tecproStackSG_out.group_id }}"
        #group_id: "{{ tecproStackSG_out.group_id }}"
        vpc_subnet_id: "{{ private_subnet1id }}"
      register: memcache_instance_out

    - name: Launch Tecpro Stack EC2 Instance for Rabbit MQ
      amazon.aws.ec2_instance:
        key_name: tecpro_key
        region: "{{ region }}"
        instance_type: t2.micro
        image_id: "{{rmq_ami}}"
        wait: yes
        wait_timeout: 300
        tags:
          Name: rabbitmq_instance
          Project: Tecprofile
          Owner: DevOps Team
        exact_count: 1
        security_groups:
          - "{{ tecproStackSG_out.group_id }}"
        #group_id: "{{ tecproStackSG_out.group_id }}"
        vpc_subnet_id: "{{ private_subnet1id }}"
      register: rabbitmq_instance_out

    - name: Launch Tecpro Stack for MySQL
      amazon.aws.ec2_instance:
        key_name: tecpro_key
        region: "{{ region }}"
        instance_type: t2.micro
        image_id: "{{mysql_ami}}"
        wait: yes
        wait_timeout: 300
        tags:
          Name: mysql_instance
          Project: Tecprofile
          Owner: DevOps Team
        exact_count: 1
        security_groups:
          - "{{ tecproStackSG_out.group_id }}"
        # group_id: "{{ tecproStackSG_out.group_id }}"
        vpc_subnet_id: "{{ private_subnet1id }}"
      register: mysql_instance_out

    - debug:
        var: mysql_instance_out.instances[0].id

    - local_action: 
        module: ec2_elb_lb
        name: "tecproELB"
        region: "{{ region }}"
        state: present
        instance_ids:
          - "{{ nginx_instance_out.instances[0].id }}"
        purge_instance_ids: true
        security_group_ids: "{{ tecproELBSG_out.group_id }}"
        subnets:
          - "{{ public_subnet1id }}"
          - "{{ public_subnet2id }}"
          - "{{ public_subnet3id }}"
        listeners:
          - protocol: HTTP # options can be https, ssl, tcp, udp
            load_balancer_port: 80
            instance_port: 80

    - name: Insert/Update IP addresses & Names in file launch-stack/group_vars/hostsip 
      blockinfile:
        path: launch-stack/group_vars/hostsip
        block: |
          nginx_ip: "{{ nginx_instance_out.instances[0].private_ip }}"
          tomcat_ip: "{{ tomcat_instance_out.instances[0].private_ip }}"
          memcache_ip: "{{ memcache_instance_out.instances[0].private_ip }}"
          rabbitmq_ip: "{{ rabbitmq_instance_out.instances[0].private_ip }}"
          mysql_ip: "{{ mysql_instance_out.instances[0].private_ip }}"

    - name: Copy login key to group_vars
      copy:
        src: logintecpro-key.pem
        dest: launch-stack/group_vars/logintecpro-key.pem
        mode: 0400

    - name: Insert/Update Inventory file launch-stack/inventry-tecpro
      blockinfile:
        path: launch-stack/inventry-tecpro
        block: |
          nginx ansible_host={{ nginx_instance_out.instances[0].private_ip }}
          tomcat ansible_host={{ tomcat_instance_out.instances[0].private_ip }} 
          memcache ansible_host={{ memcache_instance_out.instances[0].private_ip }} 
          rabbitmq ansible_host={{ rabbitmq_instance_out.instances[0].private_ip }}
          mysql ansible_host={{ mysql_instance_out.instances[0].private_ip }}
          cntl ansible_host=127.0.0.1 ansible_connection=local

          [websrvgrp]
          nginx

          [appsrvgrp]
          tomcat

          [rmqsrvgrp]
          rabbitmq

          [mcsrvgrp]
          memcache

          [dbsrvgrp]
          mysql

          [control]
          cntl

          [stack_inst:children]
          websrvgrp
          appsrvgrp
          rmqsrvgrp
          mcsrvgrp
          dbsrvgrp

          [stack_inst:vars]
          ansible_user: ubuntu
          ansible_ssh_private_key_file: logintecpro-key.pem
          ansible_python_interpreter: /usr/bin/python3

