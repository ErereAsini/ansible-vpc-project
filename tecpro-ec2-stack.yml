- name: Setup Tecprofile EC2 Stack
  hosts: localhost
  connection: local
  gather_facts: False
  tasks:

    - name: Import VPC Setup Variables
      include_vars: vars/output_vars

    - name: Import Tecpro Setup Variables
      include_vars: vars/tecprovars

    - name: Create Tecpro EC2 Key Pair
      amazon.aws.ec2_key:
        name: tecpro_key
        region: "{{ region }}"
      register: key_out

    - name: Save private key into file logintecpro-key.pem
      copy:
        content: "{{ key_out.key.private_key }}"
        dest: "./logintecpro-key.pem"
        mode: 0600
      when: key_out.changed

    - name: Create Securiry Group for Tecpro Load Balancer
      amazon.aws.ec2_group:
        name: tecproELB-sg
        description: Allow port 80 from everywhere and all port within sg
        region: "{{region}}"
        vpc_id: "{{vpc_id}}"
        rules:
          - proto: tcp
            from_port: 80
            to_port: 80
            cidr_ip: 0.0.0.0/0
      register: tecproELBSG_out

    - name: Create Securiry Group for Tecpro Stack
      amazon.aws.ec2_group:
        name: tecproStack-sg
        description: Allow port 22 from everywhere and all port within sg
        region: "{{region}}"
        vpc_id: "{{vpc_id}}"
        purge_rules: no
        rules:
          - proto: tcp
            from_port: 80
            to_port: 80
            group_id: "{{tecproELBSG_out.group_id}}"

          - proto: tcp
            from_port: 22
            to_port: 22
            group_id: "{{bastion_sgid}}"
      register: tecproStackSG_out

    - name: Update Tecpro Stack Security Group
      amazon.aws.ec2_group:
        name: tecproStack-sg
        description: Allow port 22 from everywhere and all port within sg
        region: "{{region}}"
        vpc_id: "{{vpc_id}}"
        purge_rules: no
        rules:
          - proto: all
            group_id: "{{tecproStackSG_out.group_id}}"
      register: tecproStackSG_out

    - name: Launch Tecpro Stack EC2 Instance for nginx web server
      amazon.aws.ec2_instance:
        key_name: tecpro_key
        region: "{{ region }}"
        instance_type: t2.micro
        image_id: "{{nginx_ami}}"
        wait: yes
        wait_timeout: 300
        tags:
          Name: nginx_instance
          Project: Tecprofile
          Owner: DevOps Team
        exact_count: 1
        group_id: "{{ tecproStackSG_out.group_id }}"
        vpc_subnet_id: "{{ private_subnet1id }}"
      register: nginx_instance_out

    - name: Launch Tecpro Stack EC2 Instances for Apache Tomcat
      amazon.aws.ec2_instance:
        key_name: tecpro_key
        region: "{{ region }}"
        instance_type: t2.micro
        image_id: "{{tomcat_ami}}"
        wait: yes
        wait_timeout: 300
        tags:
          Name: tomcat_instance
          Project: Tecprofile
          Owner: DevOps Team
        exact_count: 1
        group_id: "{{ tecproStackSG_out.group_id }}"
        vpc_subnet_id: "{{ private_subnet2id }}"
      register: tomcat_instance_out

    - name: Launch Tecpro Stack EC2 Instance for Memcache
      amazon.aws.ec2_instance:
        key_name: tecpro_key
        region: "{{ region }}"
        instance_type: t2.micro
        image_id: "{{memcache_ami}}"
        wait: yes
        wait_timeout: 300
        tags:
          Name: memcache_instance
          Project: Tecprofile
          Owner: DevOps Team
        exact_count: 1
        group_id: "{{ tecproStackSG_out.group_id }}"
        vpc_subnet_id: "{{ private_subnet3id }}"
      register: memcache_instance_out

    - name: Launch Tecpro Stack EC2 Instance for Rabbit MQ
      amazon.aws.ec2_instance:
        key_name: tecpro_key
        region: "{{ region }}"
        instance_type: t2.micro
        image_id: "{{rmq_ami}}"
        wait: yes
        wait_timeout: 300
        tags:
          Name: rabbitmq_instance
          Project: Tecprofile
          Owner: DevOps Team
        exact_count: 1
        group_id: "{{ tecproStackSG_out.group_id }}"
        vpc_subnet_id: "{{ private_subnet3id }}"
      register: rabbitmq_instance_out

    - name: Launch Tecpro Stack for MySQL
      amazon.aws.ec2_instance:
        key_name: tecpro_key
        region: "{{ region }}"
        instance_type: t2.micro
        image_id: "{{mysql_ami}}"
        wait: yes
        wait_timeout: 300
        tags:
          Name: mysql_instance
          Project: Tecprofile
          Owner: DevOps Team
        exact_count: 1
        group_id: "{{ tecproStackSG_out.group_id }}"
        vpc_subnet_id: "{{ private_subnet3id }}"
      register: mysql_instance_out

    - debug:
        var: mysql_instance_out  
    